name: SonarQube

on:
  push:
    branches:
      - main
    paths:
      - "src/Backend/**"
      - "src/Frontend/apps/admin/**"
      - "src/Frontend/apps/portal/**"
      - "OpenCaptive.slnx"
      - ".github/workflows/sonarqube.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/Backend/**"
      - "src/Frontend/apps/admin/**"
      - "src/Frontend/apps/portal/**"
      - "OpenCaptive.slnx"
      - ".github/workflows/sonarqube.yml"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            backend:
              - 'src/Backend/**'
              - 'OpenCaptive.slnx'
            admin:
              - 'src/Frontend/apps/admin/**'
            portal:
              - 'src/Frontend/apps/portal/**'

  api:
    name: Analyze .NET WebAPI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: zulu

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path "${{ runner.temp }}\scanner" -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}\scanner"

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" begin /k:"DanielvG-IT_OpenCaptive_Api" /o:"danielvanginneken" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.exclusions="src/Frontend/**,**/Migrations/**" /d:sonar.cpd.exclusions="**/Migrations/**"
          dotnet build OpenCaptive.slnx --configuration Release
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"

  admin:
    name: Analyze NextJS Admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: src/Frontend/apps/admin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_ADMIN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  portal:
    name: Analyze NextJS Portal
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: src/Frontend/apps/portal
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PORTAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
