name: Frontend CI (Portal)

on:
  push:
    branches: [main]
    paths:
      - "src/Frontend/apps/portal/**"
      - ".github/workflows/frontend-portal.yml"
  pull_request:
    paths:
      - "src/Frontend/apps/portal/**"
      - ".github/workflows/frontend-portal.yml"

permissions:
  contents: read

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/apps/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Frontend/apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
