name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-backend:
    name: Backend SBOM & SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore OpenCaptive.slnx

      - name: Prepare artifact directories
        run: mkdir -p artifacts/sbom artifacts/sarif

      - name: Install CycloneDX .NET tool
        run: dotnet tool install --tool-path ./.tools CycloneDX --version 6.2.0

      - name: Generate CycloneDX SBOM
        run: >
          ./.tools/dotnet-CycloneDX OpenCaptive.slnx
          --output artifacts/sbom
          --filename backend.cdx.json
          --output-format Json
          --spec-version 1.6
          --disable-package-restore

      - name: Scan SBOM
        id: sca
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          sbom: artifacts/sbom/backend.cdx.json
          output-format: sarif
          output-file: artifacts/sarif/backend.sarif
          severity-cutoff: high
          fail-build: ${{ github.event_name != 'pull_request' }}

      - name: Patch SARIF artifact locations
        if: always()
        run: |
          [ -f artifacts/sarif/backend.sarif ] || exit 0
          jq '.runs[].results[].locations |= (
                (if ((. // []) | length) == 0 then [{}] else . end)
                | map(if (.physicalLocation.artifactLocation.uri // "") == ""
                      then {physicalLocation:{artifactLocation:{uri:"artifacts/sbom/backend.cdx.json"}}}
                      else . end)
              )' \
            artifacts/sarif/backend.sarif > /tmp/backend.sarif && mv /tmp/backend.sarif artifacts/sarif/backend.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: artifacts/sarif/backend.sarif
          category: sca-backend

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-backend
          path: artifacts/sbom/backend.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce SCA gate
        if: github.event_name != 'pull_request' && steps.sca.outcome == 'failure'
        run: exit 1

  sbom-frontend:
    name: Frontend SBOM & SCA (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            path: src/Frontend/apps/admin
          - app: portal
            path: src/Frontend/apps/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci --ignore-scripts

      - name: Prepare artifact directories
        run: mkdir -p artifacts/sbom artifacts/sarif

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ matrix.path }}
          format: cyclonedx-json
          output-file: artifacts/sbom/${{ matrix.app }}.cdx.json
          upload-artifact: false

      - name: Scan SBOM
        id: sca
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          sbom: artifacts/sbom/${{ matrix.app }}.cdx.json
          output-format: sarif
          output-file: artifacts/sarif/${{ matrix.app }}.sarif
          severity-cutoff: high
          fail-build: ${{ github.event_name != 'pull_request' }}

      - name: Patch SARIF artifact locations
        if: always()
        run: |
          [ -f artifacts/sarif/${{ matrix.app }}.sarif ] || exit 0
          jq '.runs[].results[].locations |= (
                (if ((. // []) | length) == 0 then [{}] else . end)
                | map(if (.physicalLocation.artifactLocation.uri // "") == ""
                      then {physicalLocation:{artifactLocation:{uri:"artifacts/sbom/${{ matrix.app }}.cdx.json"}}}
                      else . end)
              )' \
            artifacts/sarif/${{ matrix.app }}.sarif > /tmp/${{ matrix.app }}.sarif && mv /tmp/${{ matrix.app }}.sarif artifacts/sarif/${{ matrix.app }}.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: artifacts/sarif/${{ matrix.app }}.sarif
          category: sca-frontend-${{ matrix.app }}

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-frontend-${{ matrix.app }}
          path: artifacts/sbom/${{ matrix.app }}.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce SCA gate
        if: github.event_name != 'pull_request' && steps.sca.outcome == 'failure'
        run: exit 1
